<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ゆずのおこづかい">
  <meta name="description" content="カテゴリ別に積み立てて管理する、かわいいおこづかい帳">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>ゆずのおこづかい</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">YUZU'S SAVINGS</div><h1>おこづかい管理</h1></div>
      <span class="top-flower" aria-hidden="true">✿</span>
    </header>
    <main id="app" aria-live="polite"></main>
    <button class="fab" id="addExpense" aria-label="支出を登録"><span>＋</span> 支出を記録</button>
    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-page="home" class="nav-item active"><span>⌂</span>ホーム</button>
      <button data-page="history" class="nav-item"><span>▤</span>履歴</button>
      <button data-page="settings" class="nav-item"><span>⚙</span>設定</button>
    </nav>
  </div>
  <dialog id="modal"><div id="modalContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="ledger.js"></script>
  <script src="app.js"></script>
</body>
</html>
